name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Prevent multiple workflows from running simultaneously
concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Check out repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache pip dependencies
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: \${{ runner.os }}-pip-\${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            \${{ runner.os }}-pip-

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Create necessary directories
      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p dvc_storage
          mkdir -p models
          mkdir -p mlruns

      # Restore DVC cache
      - name: Restore DVC cache
        uses: actions/cache@v3
        with:
          path: .dvc/cache
          key: \${{ runner.os }}-dvc-\${{ hashFiles('dvc.lock') }}
          restore-keys: |
            \${{ runner.os }}-dvc-

      # Download previous DVC storage
      - name: Download previous DVC storage
        uses: actions/download-artifact@v4
        with:
          name: dvc-storage
          path: dvc_storage
        continue-on-error: true

      # Run code quality checks
      - name: Code quality checks
        run: |
          black --check ./src ./tests
          isort --check-only ./src ./tests
          flake8 ./src ./tests

      # Create and validate dataset
      - name: Create dataset
        run: |
          if [ ! -f data/california_housing.csv ]; then
            python -m src.create_data_version
          fi

      # Setup DVC and track data
      - name: Setup DVC tracking
        run: |
          dvc add data/california_housing.csv
          dvc push

      # Clean up and train model
      - name: Train model
        run: |
          # Clean up existing model directories
          rm -rf models/latest
          # Train new model
          python -m src.train

      # Run tests with coverage
      - name: Run tests
        run: |
          pytest tests/ --cov=src --cov-report=xml

      # Upload coverage to Codecov
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: \${{ secrets.CODECOV_TOKEN }}
          slug: gsivakumar99/california-housing-mlops
          file: ./coverage.xml
          fail_ci_if_error: true

      # Store artifacts
      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 5

      - name: Upload DVC storage
        uses: actions/upload-artifact@v4
        with:
          name: dvc-storage
          path: dvc_storage/
          retention-days: 5

      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
          retention-days: 5
        if: success()

      # Cache DVC storage for future runs
      - name: Cache DVC storage
        uses: actions/cache@v3
        with:
          path: .dvc/cache
          key: \${{ runner.os }}-dvc-\${{ github.sha }}
        if: success()