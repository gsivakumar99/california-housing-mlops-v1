name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Prevent multiple workflows from running simultaneously
concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Check out repository
      - uses: actions/checkout@v4

      # Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Cache pip dependencies
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: \${{ runner.os }}-pip-\${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            \${{ runner.os }}-pip-

      # Try to restore previous DVC storage
      - name: Download previous DVC storage
        uses: actions/download-artifact@v4
        with:
          name: dvc-storage
          path: dvc_storage
        continue-on-error: true

      # Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Setup DVC and manage data/models
      - name: Setup DVC and manage artifacts
        run: |
          # Setup storage
          mkdir -p dvc_storage
          
          # Add data to DVC (if not already tracked)
          if [ ! -f data/california_housing.csv.dvc ]; then
            dvc add data/california_housing.csv
          fi
          
          # Push to DVC storage
          dvc push

      # Run code quality checks
      - name: Code format check
        run: |
          black --check ./src ./tests
          isort --check-only ./src ./tests
          flake8 ./src ./tests

      # Run tests and generate coverage report
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml

      # Run model training and track with MLflow
      - name: Run MLflow experiments
        run: |
          export MLFLOW_TRACKING_URI="file://\${{ github.workspace }}/mlruns"
          python -m src.train

      # Track models with DVC after training
      - name: Track models with DVC
        run: |
          if [ -d models ]; then
            dvc add models/
            dvc push
          fi

      # Upload coverage report to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: \${{ secrets.CODECOV_TOKEN }}
          slug: gsivakumar99/california-housing-mlops
          file: ./coverage.xml
          fail_ci_if_error: true

      # Store MLflow runs as artifact
      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/

      # Store DVC storage as artifact
      - name: Upload DVC storage
        uses: actions/upload-artifact@v4
        with:
          name: dvc-storage
          path: dvc_storage/

      # Store trained models as artifact (backup)
      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
        if: always()